name: ci
on:
  push: { branches: [develop, main] }
  pull_request: { branches: [develop, main] }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore backend/RALabs.sln
      - run: dotnet build backend/RALabs.sln --no-restore -v q
      - run: dotnet test backend/RALabs.sln --no-build -v q
      - run: cd backend && dotnet list package --vulnerable --include-transitive
  frontend:
    runs-on: ubuntu-latest
    strategy: { matrix: { app: [web-public, web-customer, web-admin] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: '${{ matrix.app }}/package-lock.json' }
      - run: npm ci --prefix ${{ matrix.app }}
      - run: npm audit --prefix ${{ matrix.app }} --audit-level=high
      - run: npm run build --prefix ${{ matrix.app }}
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: dotnet run --project backend/RALabs.Api & sleep 15
        env: { ConnectionStrings__DefaultConnection: '', Jwt__Secret: 'CI_Only_Secret_0123456789abcdef000000' }
      - run: npx --prefix e2e playwright install chromium --with-deps
      - run: npx --prefix e2e playwright test
        working-directory: e2e
