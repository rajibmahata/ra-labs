# RALabs platform — Docker Compose stack (dev demo + production VPS)
#
# Production: deployed on the VPS at /opt/ralabs (see docs/DEPLOYMENT.md).
# Images built ON THE VPS from repository source (docker compose up -d --build).
# Configuration comes from the .env file next to this compose file.
# Secrets never enter the repository.

services:
  api:
    image: ralabs-api:${VERSION_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=true;Encrypt=${DB_ENCRYPT:-true}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      Jwt__Issuer: ${JWT_ISSUER:-RALabs}
      Jwt__Audience: ${JWT_AUDIENCE:-RALabs}
      Github__Token: ${GITHUB_TOKEN:-}
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromEmail: ${SMTP_FROM:-noreply@ralabs.dev}
      Email__FromName: ${SMTP_FROM_NAME:-R&A Labs}
      Seed__DemoOnStartup: ${SEED_ON_STARTUP:-false}
    networks:
      - ralabs-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  web-public:
    image: ralabs-web-public:${VERSION_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web-public
    restart: unless-stopped
    networks:
      - ralabs-net
    depends_on:
      - api

  web-admin:
    image: ralabs-web-admin:${VERSION_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web-admin
    restart: unless-stopped
    networks:
      - ralabs-net
    depends_on:
      - api

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - ralabs-net
    depends_on:
      - web-public
      - web-admin
      - api

networks:
  ralabs-net:
    driver: bridge
    name: ralabs-net
